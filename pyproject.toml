[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "livewell"
version = "0.1.0"
description = "Closed-loop observer and controller for a perfused hepatocellular-carcinoma microphysiology chip"
requires-python = ">=3.8,<3.11"
license = { text = "MIT" }
dependencies = [
  "torch==1.13.1",
  "numpy==1.23.5",
  "scipy==1.9.3",
  "PyYAML==6.0",
  "pydantic==2.0.3",
  "cleo==2.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest==7.2.2",
  "hypothesis==6.68.2",
  "ruff==0.0.260",
  "black==23.1.0",
  "isort==5.12.0",
  "mypy==1.1.1",
]

[project.scripts]
livewell = "livewell.panel.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["livewell*"]

[tool.ruff]
line-length = 110
target-version = "py38"
lint.select = ["E", "F", "I"]

[tool.black]
line-length = 110

[tool.isort]
profile = "black"
line_length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
strict = true
ignore_missing_imports = false
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["scipy.*", "cleo.*", "yaml"]
ignore_missing_imports = true
